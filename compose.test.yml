services:
  redis-test:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1::6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 3s
      retries: 30
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: borderflow
      POSTGRES_PASSWORD: borderflow
      POSTGRES_DB: borderflow_test
    ports:
      - '127.0.0.1::5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U borderflow -d borderflow_test']
      interval: 1s
      timeout: 3s
      retries: 30
